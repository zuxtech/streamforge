server:
  host: 127.0.0.1
  port: 8080
  powered_by: "StreamForge" # empty string to disable

auth:
  provider: kratos
  kratos:
    url: http://127.0.0.1:4433
    database:
      schema: kratos

database:
  url: postgres://streamforge:change-me@localhost:5432/streamforge?sslmode=disable&search_path=streamforge


redis:
  url: redis://127.0.0.1:6379

storage:
  provider: s3

transcoding:
  provider: ffmpeg